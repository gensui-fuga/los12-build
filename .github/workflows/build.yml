name: Build LineageOS 19.1 for TYH212U (ARES)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'build reason'
        required: false
        default: 'manual'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout local manifests
        uses: actions/checkout@v4
        with:
          path: local_manifests

      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /opt/microsoft /usr/local/share/powershell \
            /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "=== after ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libxml2-utils python3 python-is-python3 lz4
          # repo
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV
          git config --global user.name "gensui-fuga"
          git config --global user.email "gensui-fuga@users.noreply.github.com"
          git config --global http.postBuffer 524288000

      - name: Init repo
        run: |
          mkdir -p ~/work/los
          cd ~/work/los
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --no-clone-bundle --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifests/minimal.xml .repo/local_manifests/
          echo "=== manifest project count ==="
          grep -c "<project" .repo/local_manifests/minimal.xml

      - name: Repo sync
        run: |
          cd ~/work/los
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune 2>&1 | tail -50
          echo "=== sync done ==="
          df -h /

      - name: Apply device tree
        run: |
          cd ~/work/los
          ls -la device/chinatelecom/ARES/ || echo "device tree missing!"
          ls device/chinatelecom/ARES/prebuilt/ || true
          du -sh device/chinatelecom/ARES/

      - name: Build
        run: |
          cd ~/work/los
          source build/envsetup.sh
          export WITH_GMS=false
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          export CCACHE_MAXSIZE=30G
          export CCACHE_COMPRESS=1
          ccache -M 30G -o compression=true
          lunch lineage_ARES-userdebug 2>&1 | tail -20
          echo "=== lunch ok, building ==="
          mka bacon -j$(nproc --all) 2>&1 | tail -200

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/work/los/out/build.log
          if-no-files-found: ignore

      - name: Upload ROM zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-19.1-ARES
          path: |
            ~/work/los/out/target/product/ARES/*.zip
            ~/work/los/out/target/product/ARES/boot.img
            ~/work/los/out/target/product/ARES/recovery.img
          if-no-files-found: error
          retention-days: 7
